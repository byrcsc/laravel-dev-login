name: run-tests

on:
  # `main` only: push and pull_request carry different refs, so a branch with
  # an open pull request would run the whole matrix twice.
  push:
    branches: [main]
    paths:
      - '**.php'
      - '**.blade.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'pint.json'
      - 'composer.json'
      # The demo job builds the workbench app, so its wiring counts too.
      - 'testbench.yaml'
      - 'workbench/**'
  pull_request:
    branches: [main]
    paths:
      - '**.php'
      - '**.blade.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'pint.json'
      - 'composer.json'
      # The demo job builds the workbench app, so its wiring counts too.
      - 'testbench.yaml'
      - 'workbench/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reading the repository is all this workflow needs. Without this it inherits
# the repository default, which on a new repo can be read/write.
permissions:
  contents: read

jobs:
  # Style is checked, never auto-committed: a workflow that pushes "Fix
  # styling" back races your local history. Run `composer format` instead.
  code-style:
    name: pint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: vendor/bin/pint --test

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Audit dependencies for known advisories
        run: composer audit --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci

  # The demo app is the package's own proof that it composes into a real
  # application, and the manual QA surface before a release. Building it here
  # is what stops it quietly rotting: `composer build` installs the package
  # the way an application does.
  demo:
    name: workbench demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Build the demo app from clean
        run: composer build

  # The engines SQLite stands in for during development. The package writes no
  # schema of its own, but it reads users through the guard's user provider,
  # and that is a database read on whatever engine the application runs.
  test-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.3]
        laravel: [13.*, 12.*]
        database: [mysql, pgsql]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - database: mysql
            port: 3306
            username: root
            password: secret
          - database: pgsql
            port: 5432
            username: postgres
            password: postgres

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: dev_login_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      pgsql:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_login_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, fileinfo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
        env:
          DB_DRIVER: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: dev_login_test
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}
